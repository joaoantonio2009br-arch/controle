<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Controle — Carregadores</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

:root{
  --bg:#000;
  --card:#0f0f14;
  --border:#202030;

  --p1:#00e5ff;
  --p2:#ff6b35;

  --muted:#55556d;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;

  background:#000;
  color:white;

  font-family:'Space Mono',monospace;
  touch-action:none;
}

/* ROTATE */

#rotate{
  display:none;

  position:fixed;
  inset:0;
  z-index:999;

  background:#000;

  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:20px;

  text-align:center;
  color:#666;
}

@media (orientation:portrait){
  #rotate{
    display:flex;
  }

  #app{
    display:none!important;
  }
}

/* APP */

#app{
  width:100%;
  height:100%;
}

/* CONNECT */

#connect{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  gap:24px;
  padding:24px;
}

.logo{
  font-family:'Syne',sans-serif;
  font-size:34px;
  font-weight:800;

  background:linear-gradient(90deg,var(--p1),var(--p2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.sub{
  text-align:center;
  color:#66668f;
  font-size:12px;
  line-height:1.8;
}

.row{
  display:flex;
  gap:18px;
}

.pick{
  border:none;
  border-radius:16px;

  padding:18px 34px;

  font-family:'Space Mono',monospace;
  font-size:14px;
  font-weight:700;

  cursor:pointer;

  transition:.1s;
}

.pick:active{
  transform:scale(.92);
}

.p1{
  background:var(--p1);
  color:black;
}

.p2{
  background:var(--p2);
  color:white;
}

#status{
  min-height:18px;
  color:#66668f;
  font-size:11px;
}

/* CONTROLLER */

#controller{
  display:none;

  width:100%;
  height:100%;

  position:relative;
}

/* PLAYER */

#player{
  position:absolute;

  left:22px;
  top:18px;

  font-family:'Syne',sans-serif;
  font-size:34px;
  font-weight:800;
}

/* CENTER TEXT */

#middle{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  font-family:'Syne',sans-serif;
  font-size:48px;
  font-weight:800;
  letter-spacing:6px;

  color:rgba(255,255,255,.04);

  pointer-events:none;
}

/* DPAD */

#dpad{
  position:absolute;

  left:18px;
  top:50%;

  transform:translateY(-50%);

  width:230px;
  height:230px;

  display:grid;

  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);

  gap:10px;
}

.dbtn{
  border-radius:20px;

  background:var(--card);

  border:2px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:34px;

  transition:
    transform .06s,
    background .06s,
    border-color .06s,
    box-shadow .06s;

  position:relative;
  overflow:hidden;
}

.dbtn::after{
  content:'';

  position:absolute;
  inset:0;

  background:
    radial-gradient(circle at center,
      rgba(255,255,255,.15),
      transparent 70%);

  opacity:0;
  transition:opacity .1s;
}

.dbtn.pressed::after{
  opacity:1;
}

.dbtn.pressed{
  transform:scale(.88);
}

.empty{
  opacity:0;
  pointer-events:none;
}

/* ACTIONS */

#actions{
  position:absolute;

  right:18px;
  top:50%;

  transform:translateY(-50%);

  display:flex;
  flex-direction:column;
  gap:14px;
}

.abtn{
  width:90px;

  padding:14px;

  border:none;
  border-radius:14px;

  background:#111118;
  border:1px solid #242438;

  color:white;

  font-family:'Space Mono',monospace;
  font-size:11px;

  cursor:pointer;

  transition:.1s;
}

.abtn:active{
  transform:scale(.92);
}

/* THEMES */

body.p1 #player{
  color:var(--p1);
}

body.p1 .dbtn{
  border-color:#00e5ff33;
}

body.p1 .dbtn.pressed{
  border-color:var(--p1);
  background:#00e5ff18;

  box-shadow:0 0 18px #00e5ff44;
}

body.p2 #player{
  color:var(--p2);
}

body.p2 .dbtn{
  border-color:#ff6b3533;
}

body.p2 .dbtn.pressed{
  border-color:var(--p2);
  background:#ff6b3518;

  box-shadow:0 0 18px #ff6b3544;
}
</style>
</head>
<body>

<div id="rotate">
  Gire o celular para jogar deitado
</div>

<div id="app">

  <!-- CONNECT -->

  <div id="connect">

    <div class="logo">CARREGADORES</div>

    <div class="sub">
      Escolha seu jogador<br>
      Máximo 2 controles simultâneos
    </div>

    <div class="row">
      <button class="pick p1" onclick="connect(1)">● J1</button>
      <button class="pick p2" onclick="connect(2)">● J2</button>
    </div>

    <div id="status">
      Escolha seu jogador
    </div>

  </div>

  <!-- CONTROLLER -->

  <div id="controller">

    <div id="player">J1</div>

    <div id="middle">UDEV</div>

    <!-- DPAD -->

    <div id="dpad">

      <div class="empty"></div>

      <div class="dbtn" data-dir="up">
        ↑
      </div>

      <div class="empty"></div>

      <div class="dbtn" data-dir="left">
        ←
      </div>

      <div class="empty"></div>

      <div class="dbtn" data-dir="right">
        →
      </div>

      <div class="empty"></div>

      <div class="dbtn" data-dir="down">
        ↓
      </div>

      <div class="empty"></div>

    </div>

    <!-- ACTIONS -->

    <div id="actions">

      <button class="abtn" onclick="sendAction('restart')">
        ↺<br>RESTART
      </button>

      <button class="abtn" onclick="disconnect()">
        SAIR
      </button>

    </div>

  </div>

</div>

<script>
const FB = "https://controlador-e04e0-default-rtdb.firebaseio.com";

let myP = null;
let seq = 0;
let hbTimer = null;

/* FIREBASE */

async function fbPut(path,val){
  return fetch(`${FB}${path}.json`,{
    method:"PUT",
    body:JSON.stringify(val),
    headers:{
      "Content-Type":"application/json"
    }
  });
}

/* CONNECT */

async function connect(player){

  const st = document.getElementById("status");

  st.textContent = "Conectando...";

  try{

    await fbPut(`/input/p${player}`,{
      connected:true,
      dir:"none",
      seq:0,
      ts:Date.now()
    });

    myP = player;
    seq = 0;

    showController();

    hbTimer = setInterval(()=>{
      fbPut(`/input/p${myP}/ts`,Date.now());
    },4000);

  }catch(e){

    st.textContent = "Erro ao conectar";
  }
}

function showController(){

  document.getElementById("connect").style.display = "none";
  document.getElementById("controller").style.display = "block";

  document.getElementById("player").textContent =
    "J" + myP;

  document.body.classList.remove("p1","p2");
  document.body.classList.add("p"+myP);
}

/* DISCONNECT */

async function disconnect(){

  if(!myP) return;

  try{
    await fbPut(`/input/p${myP}/connected`,false);
  }catch{}

  clearInterval(hbTimer);

  myP = null;

  document.getElementById("controller").style.display = "none";
  document.getElementById("connect").style.display = "flex";

  document.body.classList.remove("p1","p2");
}

/* SEND */

async function sendDir(dir){

  if(!myP) return;

  seq++;

  try{

    await fbPut(`/input/p${myP}`,{
      connected:true,
      dir,
      seq,
      ts:Date.now()
    });

  }catch{}
}

function sendAction(a){
  sendDir(a);
}

/* DPAD */

const btns = document.querySelectorAll(".dbtn");

const holdTimers = {};

const INITIAL_DELAY = 200;
const REPEAT_DELAY = 80;

function startPress(btn){

  const dir = btn.dataset.dir;

  if(!dir || holdTimers[dir]) return;

  btn.classList.add("pressed");

  if(navigator.vibrate){
    navigator.vibrate(12);
  }

  sendDir(dir);

  holdTimers[dir] = setTimeout(function repeat(){

    if(holdTimers[dir]){

      sendDir(dir);

      holdTimers[dir] =
        setTimeout(repeat,REPEAT_DELAY);
    }

  },INITIAL_DELAY);
}

function endPress(btn){

  const dir = btn.dataset.dir;

  if(!dir) return;

  btn.classList.remove("pressed");

  clearTimeout(holdTimers[dir]);

  delete holdTimers[dir];
}

btns.forEach(btn=>{

  btn.addEventListener("pointerdown",e=>{

    e.preventDefault();

    btn.setPointerCapture(e.pointerId);

    startPress(btn);
  });

  btn.addEventListener("pointerup",()=>{

    endPress(btn);
  });

  btn.addEventListener("pointercancel",()=>{

    endPress(btn);
  });

  btn.addEventListener("pointerleave",()=>{

    endPress(btn);
  });
});

/* PREVENT ZOOM */

document.addEventListener("touchstart",e=>{
  e.preventDefault();
},{passive:false});

document.addEventListener("touchmove",e=>{
  e.preventDefault();
},{passive:false});

/* KEYBOARD TEST */

const kmap = {
  ArrowUp:"up",
  ArrowDown:"down",
  ArrowLeft:"left",
  ArrowRight:"right",

  w:"up",
  s:"down",
  a:"left",
  d:"right",

  r:"restart"
};

document.addEventListener("keydown",e=>{

  const dir = kmap[e.key];

  if(dir){

    e.preventDefault();

    sendDir(dir);
  }
});

/* EXIT */

window.addEventListener("beforeunload",()=>{

  if(myP){

    navigator.sendBeacon(
      `${FB}/input/p${myP}/connected.json`,
      JSON.stringify(false)
    );
  }
});
</script>

</body>
</html>
