<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Controle — Carregadores</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}

    :root{
      --bg:#080810;
      --card:#111120;
      --border:#1e1e36;
      --p1:#00e5ff;
      --p2:#ff6b35;
      --accent:#fff;
      --muted:#44446a;
    }

    html,body{
      width:100%;height:100%;
      background:var(--bg);
      color:#e8e8f0;
      font-family:'Space Mono',monospace;
      overflow:hidden;
      touch-action:none;
    }

    /* ── ROTATE PROMPT ── */
    #rotate{
      display:none;
      position:fixed;inset:0;z-index:999;
      background:var(--bg);
      align-items:center;justify-content:center;
      flex-direction:column;gap:20px;
      font-size:13px;color:var(--muted);text-align:center;
    }
    #rotate svg{
      width:56px;height:56px;
      animation:rotateSvg 2.5s ease-in-out infinite;
    }
    @keyframes rotateSvg{
      0%,100%{transform:rotate(0deg);}
      40%{transform:rotate(-90deg);}
      60%{transform:rotate(-90deg);}
    }
    @media(orientation:portrait){
      #rotate{display:flex;}
      #app{display:none!important;}
    }

    /* ── APP SHELL ── */
    #app{
      width:100%;height:100%;
      display:flex;
      align-items:stretch;
      justify-content:center;
    }

    /* ── CONNECT SCREEN ── */
    #connect-screen{
      display:flex;
      flex-direction:column;
      align-items:center;justify-content:center;
      gap:24px;padding:32px;
      width:100%;
    }
    #connect-screen h1{
      font-family:'Syne',sans-serif;
      font-size:28px;font-weight:800;
      background:linear-gradient(90deg,var(--p1),var(--p2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .cs-sub{color:var(--muted);font-size:12px;text-align:center;line-height:1.8;}
    .btn-row{display:flex;gap:16px;}
    .btn-player{
      padding:16px 32px;border-radius:14px;border:none;
      font-family:'Space Mono',monospace;font-size:13px;font-weight:700;
      letter-spacing:1px;cursor:pointer;
      transition:transform .1s,opacity .1s,box-shadow .2s;
    }
    .btn-player:active{transform:scale(.93);opacity:.8;}
    .btn-p1{background:var(--p1);color:#000;box-shadow:0 0 24px var(--p1)55;}
    .btn-p2{background:var(--p2);color:#fff;box-shadow:0 0 24px var(--p2)55;}
    #cs-status{font-size:11px;color:var(--muted);min-height:16px;}

    /* ── CONTROLLER SCREEN ── */
    #ctrl-screen{
      display:none;
      width:100%;
      flex-direction:row;
      align-items:center;
      justify-content:space-between;
      padding:12px 20px 12px 16px;
      gap:16px;
    }

    /* Left: player info */
    #info-panel{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      min-width:56px;
    }
    .glow-dot{
      width:16px;height:16px;border-radius:50%;
      transition:box-shadow .3s;
    }
    #info-label{
      font-family:'Syne',sans-serif;
      font-size:22px;font-weight:800;
    }
    #info-sub{font-size:9px;color:var(--muted);letter-spacing:1px;}

    /* Center: D-pad */
    #dpad{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      grid-template-rows:repeat(3, 1fr);
      gap:8px;
      /* Size: fill available height */
      height:calc(100vh - 24px);
      width:calc(100vh - 24px);
      max-height:220px;
      max-width:220px;
    }

    .dbtn{
      border-radius:14px;
      background:var(--card);
      border:2px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      font-size:26px;
      cursor:pointer;
      transition:background .06s, transform .06s, border-color .06s, box-shadow .06s;
      position:relative;
      overflow:hidden;
    }
    /* Ripple layer */
    .dbtn::after{
      content:'';position:absolute;inset:0;
      background:radial-gradient(circle at center, rgba(255,255,255,.18) 0%, transparent 70%);
      opacity:0;transition:opacity .12s;
      border-radius:inherit;
    }
    .dbtn.pressed::after{opacity:1;}
    .dbtn.pressed{
      transform:scale(.88);
    }
    .dbtn-center{
      background:transparent;border-color:transparent;cursor:default;
    }

    /* Right: action buttons */
    #action-panel{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      min-width:64px;
    }
    .abtn{
      padding:10px 14px;
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--card);
      font-family:'Space Mono',monospace;
      font-size:10px;
      letter-spacing:1px;
      cursor:pointer;
      text-align:center;
      line-height:1.5;
      transition:background .1s,transform .08s;
      width:64px;
    }
    .abtn:active{transform:scale(.92);background:#1a1a2e;}
    #btn-restart{color:#88aaff;}
    #btn-out{color:var(--muted);font-size:9px;}

    /* ── COLOR THEMES ── */
    body.p1 #info-label{color:var(--p1);}
    body.p1 .dbtn{border-color:var(--p1)33;}
    body.p1 .dbtn.pressed{border-color:var(--p1);background:var(--p1)18;box-shadow:0 0 16px var(--p1)44;}
    body.p1 #btn-restart{border-color:var(--p1)55;color:var(--p1);}

    body.p2 #info-label{color:var(--p2);}
    body.p2 .dbtn{border-color:var(--p2)33;}
    body.p2 .dbtn.pressed{border-color:var(--p2);background:var(--p2)18;box-shadow:0 0 16px var(--p2)44;}
    body.p2 #btn-restart{border-color:var(--p2)55;color:var(--p2);}

    /* Vibration feedback via CSS — visual only */
    @keyframes bump{0%,100%{transform:scale(1);}50%{transform:scale(.85);}}
  </style>
</head>
<body>

<!-- Rotate hint -->
<div id="rotate">
  <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="14" y="8" width="28" height="40" rx="5" stroke="#44446a" stroke-width="2.5"/>
    <circle cx="28" cy="43" r="2" fill="#44446a"/>
    <path d="M36 4 L42 10 L36 16" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 10 Q20 10 20 28" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" fill="none"/>
  </svg>
  <span>Gire o celular<br>para jogar deitado</span>
</div>

<div id="app">

  <!-- CONNECTION -->
  <div id="connect-screen">
    <h1>CARREGADORES</h1>
    <p class="cs-sub">Escolha seu jogador.<br>Máximo 2 controles simultâneos.</p>
    <div class="btn-row">
      <button class="btn-player btn-p1" onclick="connect(1)">● J1</button>
      <button class="btn-player btn-p2" onclick="connect(2)">● J2</button>
    </div>
    <div id="cs-status">Escolha seu jogador</div>
  </div>

  <!-- CONTROLLER -->
  <div id="ctrl-screen">

    <div id="info-panel">
      <div class="glow-dot" id="info-dot"></div>
      <div id="info-label">J1</div>
      <div id="info-sub">JOGADOR</div>
    </div>

    <div id="dpad">
      <!-- row 1: up -->
      <div></div>
      <div class="dbtn" id="btn-up"    data-dir="up">↑</div>
      <div></div>
      <!-- row 2: left/center/right -->
      <div class="dbtn" id="btn-left"  data-dir="left">←</div>
      <div class="dbtn-center dbtn"></div>
      <div class="dbtn" id="btn-right" data-dir="right">→</div>
      <!-- row 3: down -->
      <div></div>
      <div class="dbtn" id="btn-down"  data-dir="down">↓</div>
      <div></div>
    </div>

    <div id="action-panel">
      <button class="abtn" id="btn-restart" onclick="sendAction('restart')">↺<br>RESTART</button>
      <button class="abtn" id="btn-out" onclick="disconnect()">SAIR</button>
    </div>

  </div>
</div>

<script>
const FB = "https://controlador-e04e0-default-rtdb.firebaseio.com";
let myP = null, seq = 0, hbTimer = null;

// ── Firebase helpers ──────────────────────────────
async function fbPut(path, val) {
  return fetch(`${FB}${path}.json`, {
    method:"PUT", body:JSON.stringify(val),
    headers:{"Content-Type":"application/json"}
  });
}

// ── Connect ───────────────────────────────────────
async function connect(player) {
  const st = document.getElementById("cs-status");
  st.textContent = "Conectando...";
  try {
    await fbPut(`/input/p${player}`, {
      connected: true, dir:"none", seq:0, ts:Date.now()
    });
    myP = player;
    seq = 0;
    showCtrl();
    hbTimer = setInterval(() => fbPut(`/input/p${myP}/ts`, Date.now()), 4000);
  } catch(e) {
    st.textContent = "Erro — tente novamente";
  }
}

function showCtrl() {
  document.getElementById("connect-screen").style.display = "none";
  const cs = document.getElementById("ctrl-screen");
  cs.style.display = "flex";
  document.getElementById("info-label").textContent = "J" + myP;
  const color = myP===1 ? "#00e5ff" : "#ff6b35";
  const dot = document.getElementById("info-dot");
  dot.style.background = color;
  dot.style.boxShadow = `0 0 12px ${color}`;
  document.body.classList.add("p"+myP);
}

async function disconnect() {
  if (!myP) return;
  try { await fbPut(`/input/p${myP}/connected`, false); } catch{}
  clearInterval(hbTimer);
  myP = null;
  document.body.classList.remove("p1","p2");
  document.getElementById("ctrl-screen").style.display = "none";
  document.getElementById("connect-screen").style.display = "flex";
  document.getElementById("cs-status").textContent = "Desconectado.";
}

// ── Send input ────────────────────────────────────
async function sendDir(dir) {
  if (!myP) return;
  seq++;
  try {
    await fbPut(`/input/p${myP}`, {
      connected:true, dir, seq, ts:Date.now()
    });
  } catch {}
}

function sendAction(a) { sendDir(a); }

// ── D-pad — hold to repeat ────────────────────────
const INITIAL_DELAY = 220;  // ms before repeat starts
const REPEAT_DELAY  = 90;   // ms between repeats while held

const btns = document.querySelectorAll(".dbtn[data-dir]");
const holdTimers = {};

function startPress(btn) {
  const dir = btn.dataset.dir;
  if (!dir || holdTimers[dir]) return;

  btn.classList.add("pressed");

  // Haptic feedback
  if (navigator.vibrate) navigator.vibrate(18);

  sendDir(dir);

  holdTimers[dir] = setTimeout(function repeat() {
    if (holdTimers[dir] != null) {
      sendDir(dir);
      holdTimers[dir] = setTimeout(repeat, REPEAT_DELAY);
    }
  }, INITIAL_DELAY);
}

function endPress(btn) {
  const dir = btn.dataset.dir;
  if (!dir) return;
  btn.classList.remove("pressed");
  clearTimeout(holdTimers[dir]);
  delete holdTimers[dir];
}

btns.forEach(btn => {
  // Pointer events handle both touch and mouse cleanly
  btn.addEventListener("pointerdown",  e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); startPress(btn); });
  btn.addEventListener("pointerup",    e => { e.preventDefault(); endPress(btn); });
  btn.addEventListener("pointercancel",e => { endPress(btn); });
  btn.addEventListener("pointerleave", e => { endPress(btn); });
});

// Block page scroll/zoom on touch
document.addEventListener("touchstart", e => e.preventDefault(), {passive:false});
document.addEventListener("touchmove",  e => e.preventDefault(), {passive:false});

// Keyboard shortcuts (for testing on desktop)
const kmap = {ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",
              w:"up",s:"down",a:"left",d:"right",r:"restart"};
const kDown = {};
document.addEventListener("keydown", e => {
  if (kDown[e.key]) return; kDown[e.key] = true;
  const dir = kmap[e.key];
  if (dir) { e.preventDefault(); sendDir(dir); }
});
document.addEventListener("keyup", e => { delete kDown[e.key]; });

// Disconnect on page close
window.addEventListener("beforeunload", () => {
  if (myP) navigator.sendBeacon(`${FB}/input/p${myP}/connected.json`, JSON.stringify(false));
});
</script>
</body>
</html>
