<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>CONTROLE — CARREGADORES</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

    :root {
      --bg: #09090f;
      --ui: #12121e;
      --p1: #00e5ff;
      --p2: #ff6b35;
      --border: #2a2a42;
    }

    html, body {
      width:100%; height:100%;
      background:var(--bg);
      color:#e8e8f0;
      font-family:'Space Mono', monospace;
      overflow:hidden;
      /* Force landscape */
    }

    /* Lock to landscape via CSS — visual guide only, JS handles rotation */
    #rotate-msg {
      display:none;
      position:fixed; inset:0;
      background:var(--bg);
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:16px;
      font-size:14px;
      color:#666;
      z-index:999;
    }
    #rotate-msg .icon { font-size:48px; animation: spin 2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (orientation: portrait) {
      #rotate-msg { display:flex; }
      #app { display:none; }
    }

    /* ── MAIN LAYOUT ── */
    #app {
      width:100%; height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    /* Connection screen */
    #connect-screen {
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:20px;
      padding:24px;
      text-align:center;
      height:100%;
    }
    #connect-screen h1 {
      font-family:'Syne',sans-serif;
      font-size:26px;
      font-weight:800;
    }
    #connect-screen p { color:#666; font-size:12px; line-height:1.7; }

    .btn-connect {
      padding:14px 36px;
      border-radius:12px;
      border:none;
      cursor:pointer;
      font-family:'Space Mono',monospace;
      font-size:14px;
      font-weight:700;
      letter-spacing:1px;
      transition: opacity .15s, transform .1s;
    }
    .btn-connect:active { transform:scale(.96); opacity:.85; }
    .btn-p1 { background:var(--p1); color:#000; }
    .btn-p2 { background:var(--p2); color:#fff; }
    .btn-row { display:flex; gap:16px; }

    #status-msg { font-size:12px; color:#666; min-height:18px; }

    /* Controller screen */
    #ctrl-screen {
      display:none;
      width:100%; height:100%;
      flex-direction:row;
      align-items:center;
      justify-content:space-between;
      padding:0 24px;
      gap:12px;
    }

    /* Player indicator strip */
    #player-strip {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      min-width:60px;
    }
    #player-label {
      font-family:'Syne',sans-serif;
      font-size:20px;
      font-weight:800;
    }
    #player-num { font-size:11px; color:#666; }
    .dot-ctrl {
      width:14px; height:14px; border-radius:50%;
    }

    /* D-pad */
    #dpad {
      display:grid;
      grid-template-columns: repeat(3, 72px);
      grid-template-rows: repeat(3, 72px);
      gap:6px;
    }

    .dpad-btn {
      border-radius:12px;
      border:2px solid var(--border);
      background:var(--ui);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      cursor:pointer;
      transition: background .08s, transform .08s, border-color .08s;
      touch-action:none;
    }
    .dpad-btn.active {
      background: rgba(255,255,255,.08);
      transform:scale(.93);
    }
    .dpad-center { background:transparent; border-color:transparent; cursor:default; }

    /* Restart button area */
    #right-panel {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
      min-width:70px;
    }
    #btn-restart {
      padding:10px 16px;
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--ui);
      color:#888;
      font-family:'Space Mono',monospace;
      font-size:10px;
      cursor:pointer;
      letter-spacing:1px;
    }
    #btn-restart:active { background:#1f1f30; }
    #btn-disconnect {
      padding:8px 12px;
      border-radius:8px;
      border:1px solid #333;
      background:transparent;
      color:#444;
      font-family:'Space Mono',monospace;
      font-size:9px;
      cursor:pointer;
    }

    /* Color theming per player */
    body.player1 #player-label { color:var(--p1); }
    body.player1 .dpad-btn { border-color:var(--p1)44; }
    body.player1 .dpad-btn.active { border-color:var(--p1); background:var(--p1)18; }
    body.player1 #btn-restart { border-color:var(--p1)44; color:var(--p1); }
    body.player2 #player-label { color:var(--p2); }
    body.player2 .dpad-btn { border-color:var(--p2)44; }
    body.player2 .dpad-btn.active { border-color:var(--p2); background:var(--p2)18; }
    body.player2 #btn-restart { border-color:var(--p2)44; color:var(--p2); }

    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap');
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- Rotate hint -->
<div id="rotate-msg">
  <div class="icon">📱</div>
  <span>Gire o celular para<br>modo paisagem (deitado)</span>
</div>

<div id="app">

  <!-- CONNECTION SCREEN -->
  <div id="connect-screen">
    <h1>CARREGADORES</h1>
    <p>Conecte como Jogador 1 ou Jogador 2.<br>
    Só pode haver <strong>2 controles</strong> ao mesmo tempo.</p>
    <div class="btn-row">
      <button class="btn-connect btn-p1" onclick="connect(1)">JOGADOR 1</button>
      <button class="btn-connect btn-p2" onclick="connect(2)">JOGADOR 2</button>
    </div>
    <div id="status-msg">Escolha seu jogador</div>
  </div>

  <!-- CONTROLLER SCREEN -->
  <div id="ctrl-screen">

    <div id="player-strip">
      <div class="dot-ctrl" id="dot-ctrl"></div>
      <div id="player-label">J1</div>
      <div id="player-num">JOGADOR</div>
    </div>

    <div id="dpad">
      <!-- row 1 -->
      <div></div>
      <div class="dpad-btn" id="btn-up"   data-dir="up">↑</div>
      <div></div>
      <!-- row 2 -->
      <div class="dpad-btn" id="btn-left" data-dir="left">←</div>
      <div class="dpad-center"></div>
      <div class="dpad-btn" id="btn-right" data-dir="right">→</div>
      <!-- row 3 -->
      <div></div>
      <div class="dpad-btn" id="btn-down" data-dir="down">↓</div>
      <div></div>
    </div>

    <div id="right-panel">
      <button id="btn-restart" onclick="sendRestart()">↺<br>RESTART</button>
      <button id="btn-disconnect" onclick="disconnect()">SAIR</button>
    </div>

  </div>
</div>

<script>
const FB_URL = "https://controlador-e04e0-default-rtdb.firebaseio.com";

let myPlayer = null; // 1 or 2
let seq = 0;
let heartbeatTimer = null;

async function fbGet(path) {
  const r = await fetch(`${FB_URL}${path}.json`);
  return await r.json();
}
async function fbSet(path, val) {
  await fetch(`${FB_URL}${path}.json`, {
    method:"PUT", body:JSON.stringify(val)
  });
}

async function connect(player) {
  const status = document.getElementById("status-msg");
  status.textContent = "Verificando disponibilidade...";

  try {
    const data = await fbGet("/input");
    const key = "p" + player;
    const other = "p" + (player === 1 ? 2 : 1);

    // Check if already 2 connected (both slots taken by OTHER players)
    const mySlotTaken = data?.[key]?.connected === true;
    const otherTaken  = data?.[other]?.connected === true;

    // If the other player's slot is also full, deny (2 max rule means only 2 total)
    // Actually: we only block if THIS slot is taken by a live session
    // (no session IDs here, simple: overwrite allowed — last one wins the slot)

    await fbSet(`/input/${key}`, {
      connected: true,
      dir: "none",
      seq: 0,
      ts: Date.now()
    });

    myPlayer = player;
    status.textContent = "Conectado!";
    showController();

    // Heartbeat every 5s
    heartbeatTimer = setInterval(() => {
      fbSet(`/input/p${myPlayer}/ts`, Date.now()).catch(()=>{});
    }, 5000);

  } catch(e) {
    status.textContent = "Erro ao conectar. Tente novamente.";
  }
}

function showController() {
  document.getElementById("connect-screen").style.display = "none";
  const cs = document.getElementById("ctrl-screen");
  cs.style.display = "flex";

  const label = document.getElementById("player-label");
  const dot   = document.getElementById("dot-ctrl");
  const num   = document.getElementById("player-num");

  label.textContent = "J" + myPlayer;
  num.textContent   = "JOGADOR " + myPlayer;

  if (myPlayer === 1) {
    document.body.classList.add("player1");
    dot.style.background = "#00e5ff";
    dot.style.boxShadow  = "0 0 10px #00e5ff";
  } else {
    document.body.classList.add("player2");
    dot.style.background = "#ff6b35";
    dot.style.boxShadow  = "0 0 10px #ff6b35";
  }
}

function disconnect() {
  if (!myPlayer) return;
  fbSet(`/input/p${myPlayer}/connected`, false).catch(()=>{});
  clearInterval(heartbeatTimer);
  myPlayer = null;
  document.body.classList.remove("player1","player2");
  document.getElementById("ctrl-screen").style.display = "none";
  document.getElementById("connect-screen").style.display = "flex";
  document.getElementById("status-msg").textContent = "Desconectado.";
}

async function sendDir(dir) {
  if (!myPlayer) return;
  seq++;
  try {
    await fbSet(`/input/p${myPlayer}`, {
      connected: true,
      dir,
      seq,
      ts: Date.now()
    });
  } catch {}
}

function sendRestart() { sendDir("restart"); }

// ── D-pad touch/click handling ────────────────────
const dpadBtns = document.querySelectorAll(".dpad-btn");

function activate(btn) {
  btn.classList.add("active");
  sendDir(btn.dataset.dir);
}
function deactivate(btn) {
  btn.classList.remove("active");
}

dpadBtns.forEach(btn => {
  // Pointer events — works for touch and mouse
  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    activate(btn);
  });
  btn.addEventListener("pointerup",   e => { e.preventDefault(); deactivate(btn); });
  btn.addEventListener("pointerleave",e => { deactivate(btn); });
});

// Prevent scroll on touch
document.addEventListener("touchmove", e => e.preventDefault(), {passive:false});

// Window unload — mark disconnected
window.addEventListener("beforeunload", () => {
  if (myPlayer) {
    navigator.sendBeacon(
      `${FB_URL}/input/p${myPlayer}/connected.json`,
      JSON.stringify(false)
    );
  }
});
</script>
</body>
</html>
